<style>
.fx_card{--fx_bg:#fff;--fx_in:#F5F8FC;--fx_ln:#E3EAF3;--fx_tx:#16233A;--fx_mu:#6B7A90;--fx_pr:#145E99;--fx_pr2:#0F4C7E;--fx_lt:#A9D1F3;--fx_bad:#B83A2E;
 background:var(--fx_bg);border:1px solid var(--fx_ln);border-radius:28px;padding:14px;margin:0 0 16px;box-shadow:0 18px 40px rgba(20,60,110,.10)}
.fx_in{background:var(--fx_in);border:1px solid var(--fx_ln);border-radius:22px;padding:18px}
.fx_hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.fx_hd h2{margin:0;font-size:22px;font-weight:800;color:var(--fx_tx)}
.fx_hd small{display:block;margin-top:4px;font-size:14px;color:var(--fx_mu)}
.fx_bell{position:relative;flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--fx_ln);background:var(--fx_bg);color:var(--fx_tx);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.fx_bell svg{width:22px;height:22px}
.fx_bell b{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--fx_bad);color:#fff;font-size:11px;line-height:20px;text-align:center}
.fx_g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fx_k{background:var(--fx_bg);border:1px solid var(--fx_ln);border-radius:20px;padding:16px 18px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:start;font:inherit;color:var(--fx_tx)}
.fx_k span{font-size:14px;color:var(--fx_mu)}
.fx_k b{font-size:26px;font-weight:800;margin-top:10px;white-space:nowrap}
.fx_k b em{font-style:normal;font-size:14px;font-weight:600;margin-inline-start:4px;opacity:.8}
.fx_k.fx_p{background:var(--fx_pr);border-color:var(--fx_pr);color:#fff}
.fx_k.fx_p span{color:#D6E8F7}
.fx_k.fx_d b{color:var(--fx_bad)}
.fx_ch{background:var(--fx_bg);border:1px solid var(--fx_ln);border-radius:20px;padding:16px 18px}
.fx_ch .fx_t{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.fx_ch .fx_t b{font-size:17px;color:var(--fx_tx)}
.fx_ch .fx_t span{font-size:14px;color:var(--fx_mu)}
.fx_bars{display:flex;align-items:flex-end;gap:7px;height:170px}
.fx_bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.fx_bar i{display:block;width:100%;max-width:44px;border-radius:12px;background:var(--fx_lt);min-height:6px;transition:height .3s}
.fx_bar.fx_c i{background:var(--fx_pr2)}
.fx_bar small{font-size:10px;color:var(--fx_mu);margin-top:6px;white-space:nowrap}
.fx_bar.fx_c small{color:var(--fx_tx);font-weight:700}
.fx_sec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fx_s{background:var(--fx_bg);border:1px solid var(--fx_ln);border-radius:16px;padding:12px 14px}
.fx_s span{display:block;font-size:13px;color:var(--fx_mu)}
.fx_s b{display:block;font-size:17px;margin-top:4px;color:var(--fx_tx)}
.fx_s small{display:block;font-size:12px;color:var(--fx_mu);margin-top:2px}
@media (min-width:900px){.fx_wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:stretch}.fx_wrap .fx_g{margin-bottom:0}.fx_ch{display:flex;flex-direction:column}.fx_bars{flex:1;height:auto;min-height:170px}}
@media (max-width:380px){.fx_k b{font-size:21px}.fx_in{padding:14px}.fx_bars{gap:4px}}
@media screen{html[data-th=dark] .fx_card{--fx_bg:#151935;--fx_in:#0F1229;--fx_ln:#262A47;--fx_tx:#F1F2FF;--fx_mu:#8D92B8;--fx_pr:#3E5BD8;--fx_pr2:#8B97F7;--fx_lt:#2E3768;--fx_bad:#FF7A7A;box-shadow:none}}
@media print{.fx_card{display:none}}
</style>
<script>
(function(){
if(typeof lDash!=='function')return;
const _orig=lDash;
const fmt=v=>{let n=Math.round(+v||0);return String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
window.fxGoUnpaid=function(){try{$("#ip").value="0"}catch(e){}go(2)};
lDash=function(){
 _orig.apply(this,arguments);
 try{
  const dk=$("#dk");if(!dk)return;
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth(),Yn=Y;
  const paid=D.invs.filter(i=>i.paid&&SB(i.s));
  const ym=i=>String(i.pd||i.date||'').slice(0,7);
  const mon=Array.from({length:12},(_,m)=>paid.filter(i=>ym(i)===Yn+'-'+String(m+1).padStart(2,'0')).reduce((t,i)=>t+tot(i),0));
  const mIdx=Yn==cy?cm:11;
  const inv=D.invs.filter(i=>i.y==Yn&&SB(i.s)),sm=a=>a.reduce((t,i)=>t+tot(i),0),billed=sm(inv),coll=sm(inv.filter(i=>i.paid));
  const pc=billed?Math.round(coll/billed*100):0;
  const unp=D.invs.filter(i=>!i.paid&&SB(i.s)),ut=sm(unp),late=new Set(unp.map(i=>i.s)).size;
  const N=D.subs.length,sg=D.subs.filter(s=>s.ct).length;
  let ok=0,cn=0;D.subs.forEach(s=>{let v=D.reads[key(s.id,Y,R)];if(v){ok++;cn+=Math.max(0,v.n-v.o)}});
  let C=[+D.cfg.oc||0,+D.cfg.ob||0];try{evs().forEach(x=>{let f=eff(x);C[0]+=f[0];C[1]+=f[1]})}catch(e){}
  const mx=Math.max(1,...mon);
  const bars=mon.map((v,m)=>`<div class="fx_bar${m===mIdx?' fx_c':''}" title="${MO[m]}: ${fmt(v)} د.م"><i style="height:${Math.max(4,v/mx*100)}%"></i><small>${MO[m].slice(0,3)}</small></div>`).join('');
  const nm=(D.cfg.short||'جمعية الفتح');
  const dt=now.toLocaleDateString(typeof isFR==='function'&&isFR()?'fr-FR':'ar-MA',{day:'numeric',month:'long',year:'numeric'});
  const B=v=>`<bdi dir="ltr">${fmt(v)}</bdi>`;
  const card=`<div class="fx_card"><div class="fx_in">
   <div class="fx_hd"><div><h2>نظرة عامة</h2><small>${esc(nm)} · ${dt}</small></div>
    <button class="fx_bell" type="button" onclick="fxGoUnpaid()" title="المتأخرون عن الأداء" aria-label="المتأخرون عن الأداء">${BELL}${late?`<b>${late}</b>`:''}</button></div>
   <div class="fx_wrap">
    <div class="fx_g">
     <button type="button" class="fx_k fx_p" onclick="go(2)"><span>المداخيل — ${MO[mIdx]}</span><b><bdi dir="ltr">${fmt(mon[mIdx])}</bdi><em>د.م</em></b></button>
     <button type="button" class="fx_k" onclick="go(2)"><span>الاستخلاص ${Yn}</span><b><bdi dir="ltr">${pc}%</bdi></b></button>
     <button type="button" class="fx_k" onclick="go(0)"><span>المشتركون</span><b><bdi dir="ltr">${fmt(N)}</bdi></b></button>
     <button type="button" class="fx_k fx_d" onclick="fxGoUnpaid()"><span>الديون</span><b><bdi dir="ltr">${fmt(ut)}</bdi><em>د.م</em></b></button>
    </div>
    <div class="fx_ch"><div class="fx_t"><b>المداخيل الشهرية</b><span>${Yn}</span></div><div class="fx_bars">${bars}</div></div>
   </div>
   <div class="fx_sec">
    <div class="fx_s"><span>الاستهلاك — ${RN[R].split(" (")[0]}</span><b><bdi dir="ltr">${+cn.toFixed(2)}</bdi> م³</b><small>قراءات: <bdi dir="ltr">${ok} / ${N}</bdi></small></div>
    <div class="fx_s"><span>الخزينة</span><b><bdi dir="ltr">${fmt(C[0]+C[1])}</bdi> د.م</b><small>صندوق ${B(C[0])} · بنك ${B(C[1])}</small></div>
   </div>
  </div></div>`;
  const st=dk.querySelector('.stats');if(st)st.remove();
  const ds=dk.querySelector('.dsub');
  if(ds)ds.remove();
  dk.insertAdjacentHTML('afterbegin',card);
 }catch(e){console.error('fx dash',e)}
};
})();
</script>
