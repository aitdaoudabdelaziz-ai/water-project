/* برنامج الماء — React. الهوية: واحة وخطّارة.
   حبر الحوض للنصوص والشريط، أزرق الساقية للأفعال، أخضر النخيل لما أُدّي، الزعفران لما ينتظر، الرمان للمتأخر.
   الخط: Noto Kufi Arabic (مُضمَّن في البرنامج، يعمل بدون إنترنت) للعناوين والنص. الحركة الوحيدة المقصودة: بكرات العدّاد. */
:root{--ink:#12324D;--navy:#0F2B44;--water:#1A8BA5;--gold:#E2A42B;--palm:#2E8B57;--stone:#EEF3F7;--saffron:#C98F12;--pom:#C0392B;--card:#FFFFFF;--line:#C9D7E3;--mu:#5E7183;--soft:#E4ECF3;--tx:#12324D;
 --fd:"Noto Kufi Arabic",Tahoma,sans-serif;--fb:"Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif;
 font-family:var(--fb);color:var(--tx);background:var(--stone);-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:root:not([data-th=light]){--stone:#0A1824;--card:#112536;--line:#22405A;--soft:#16324A;--tx:#E6EEF5;--mu:#93A8BB;--water:#3FB1CC;--gold:#F0B94A;--palm:#56C08A;--saffron:#E7B54A;--pom:#F07A86;--navy:#081624;--ink:#E6EEF5}}
:root[data-th=dark]{--stone:#0A1824;--card:#112536;--line:#22405A;--soft:#16324A;--tx:#E6EEF5;--mu:#93A8BB;--water:#3FB1CC;--gold:#F0B94A;--palm:#56C08A;--saffron:#E7B54A;--pom:#F07A86;--navy:#081624;--ink:#E6EEF5}
*{box-sizing:border-box}html,body{margin:0;background:var(--stone)}body{min-height:100vh;padding-bottom:84px;line-height:1.7;font-size:15px}
button,input,select{font:inherit;color:inherit}bdi{unicode-bidi:isolate;font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.preview{background:var(--soft);color:var(--mu);text-align:center;font-size:13px;padding:6px 12px}.preview a{color:var(--water);font-weight:700}
/* الرأس */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--navy);color:#EAF4F7;position:sticky;top:0;z-index:10}
.top img{border-radius:50%;background:#fff}.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--fd);font-weight:700;font-size:18px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;color:#9FC3CF;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#EAF4F7;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:20px;height:20px;fill:#F2C14E;stroke:none}
.main{max-width:1120px;margin:0 auto;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-family:var(--fd);font-weight:700;font-size:24px;line-height:1.3}h3{margin:0;font-family:var(--fd);font-weight:700;font-size:20px}h4{margin:18px 0 8px;font-size:15px}
.note{color:var(--mu);font-size:13.5px;margin:4px 0 0}
.cnt{display:inline-block;min-width:28px;padding:0 9px;border-radius:8px;background:var(--soft);font-family:var(--fb);font-size:13px;font-weight:700;text-align:center;vertical-align:middle}
/* الأسطح: لوحة واحدة لكل شاشة، والصفوف داخلها مفصولة بخطوط */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
/* لوحة القيادة */
.hero{background:var(--card);border-radius:22px;padding:18px}
.hero-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}.hero-h small{color:var(--mu)}
.bell{position:relative;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.bell b{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--pom);color:#fff;font-size:11px;line-height:20px}
.hero-g{display:grid;gap:14px}@media(min-width:900px){.hero-g{grid-template-columns:1fr 1.15fr}}
.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;min-width:0;overflow:hidden;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
.kpi-l{font-size:13.5px;color:var(--mu)}.kpi-v{font-family:var(--fd);font-size:clamp(19px,6.4vw,30px);font-weight:700;line-height:1.2;white-space:nowrap}.kpi-v em{font-family:var(--fb);font-style:normal;font-size:13px;margin-inline-start:4px;color:var(--mu);font-weight:500}
.kpi-pri{background:var(--navy);color:#fff}.kpi-pri .kpi-l,.kpi-pri .kpi-v em{color:#9FC3CF}.kpi-bad .kpi-v{color:var(--pom)}
:root[data-th=dark] .kpi-pri{background:#0B3A4E}
.pill{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;font-size:12.5px;color:var(--mu)}
.kpi-pri .pill{color:#CFE6EE}
.chart{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}
.chart-t{display:flex;justify-content:space-between;margin-bottom:10px}.chart-t span{color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;flex:1 0 170px;border-bottom:1px solid var(--line)}
.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bar i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:color-mix(in srgb,var(--water) 28%,var(--card))}
.bar.cur i{background:var(--water)}.bar small{font-size:10.5px;color:var(--mu);margin-top:4px;white-space:nowrap;transform:translateY(100%);height:0}.bars{margin-bottom:22px}
.bar.cur small{color:var(--tx);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tile{border-top:3px solid var(--water);padding-top:8px}.tile span,.tile small{display:block;color:var(--mu);font-size:13px}.tile b{display:block;font-family:var(--fd);font-size:20px;margin:2px 0}
.flow{background:var(--card);border-radius:22px;padding:18px}
.flow-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.flow-t span{color:var(--mu);font-size:13.5px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:0;min-width:0;border-top:4px solid var(--mu)}
.col:nth-child(2){border-top-color:var(--saffron)}.col:nth-child(3){border-top-color:var(--palm)}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 2px}.col-h b{flex:1}.dot{display:none}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:hover .item-i b{color:var(--water)}.item:focus-visible{outline:3px solid var(--water);outline-offset:0}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.item-i,.row-i{min-width:0}.item-i b,.row-i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-i small,.row-i small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-s{font-size:12.5px;font-weight:700;color:var(--water);white-space:nowrap}
.t-late .item-s,.bad{color:var(--pom)!important}.good{color:var(--palm)!important}
.more{background:none;border:0;color:var(--water);font-weight:700;cursor:pointer;padding:10px 2px;text-align:start}
.empty{padding:20px 8px;color:var(--mu);font-size:14px}

.pv .ktb td{background:#ececec;font-size:9.5pt;padding:1.1mm 1mm;border:.2mm solid #fff}
.pv .ktb tr.kt td{background:#D3E0C9;font-weight:bold;color:#17382D}
.pv .ktb td:first-child,.pv .ktb th:first-child{text-align:right;padding-right:3mm}
.pv .ktr{display:flex;gap:4mm;align-items:center}
.pv .ktt{background:#D3E0C9;border:.3mm solid #0F7B5C;padding:1.5mm 4mm;font-weight:bold;font-size:11pt;color:#17382D;flex:1}.pv .ktt .gr{font-size:12pt}
.pv .kps{flex:0 0 40mm;text-align:center;border:.7mm solid #2e7d32;color:#2e7d32;border-radius:2mm;font-weight:bold;font-size:15pt;transform:rotate(-5deg);padding:1.2mm}
.pv .ksig{display:flex;justify-content:space-around;padding:6mm 0 10mm;font-weight:bold}
.pv .kft{background:#17382D;color:#fff;text-align:center;border-radius:4mm;padding:1.6mm;font-size:8pt;font-weight:bold}
@media print{
 @page{size:A4;margin:6mm}
 .pv .kpg{zoom:1;margin:0;width:auto;min-height:0;padding:0;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pv .kpg:last-child{page-break-after:auto}
}
.bal .tot b,.bal .tot b bdi{color:#fff}
.pv-bar .btn:not(.pri){color:var(--tx)}
.pv .kbody>.ktt{flex:none}
.kb-mt{margin-top:12px}
