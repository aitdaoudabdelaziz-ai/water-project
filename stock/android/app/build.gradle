plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.gestion.stock'
    compileSdk 35

    defaultConfig {
        applicationId 'ma.gestion.stock'
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '1') as int)
        versionName '1.' + (project.findProperty('vc') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('gestionstock.keystore')
            storePassword 'gestionstock'
            keyAlias 'gestionstock'
            keyPassword 'gestionstock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
