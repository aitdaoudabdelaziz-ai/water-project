<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion de stock et facturation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1b2320;--muted:#6a736f;--line:#e3dfd5;--acc:#0f5e5a;--acc-soft:#e3efed;--warn:#b45309;--warn-soft:#fdf0dc;--red:#b42318;--red-soft:#fde8e6;--green:#157f3d;--green-soft:#e2f4e8;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px}
.top .logo{width:34px;height:34px;border-radius:9px;background:#fff center/contain no-repeat;flex:none;display:grid;place-items:center;color:var(--acc);font-weight:800}
.top h1{font-size:16px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.75}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.iconbtn.on{background:#fff;color:var(--acc)}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:8px 16px;text-align:center}
main{max-width:920px;margin:0 auto;padding:16px 14px 110px}
h2{font-size:20px;margin:4px 0 14px;font-weight:800;letter-spacing:-.01em}
h3{font-size:14px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:19px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.red .v{color:var(--red)}.kpi.warn .v{color:var(--warn)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:#faf8f4}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.item .r .s{font-weight:500}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.green{background:var(--green-soft);color:var(--green)}.badge.grey{background:#eeece6;color:var(--muted)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.fab{position:fixed;right:18px;bottom:84px;z-index:15;width:56px;height:56px;border-radius:18px;border:0;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(15,94,90,.35);cursor:pointer}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
nav.nav button svg{width:22px;height:22px}
nav.nav button.on{color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(20,26,24,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h4{margin:0;font-size:17px;flex:1}
.sheet .body{padding:14px 16px 20px;overflow-y:auto}
.x{border:0;background:#e9e6de;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
textarea.in{min-height:76px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.lgrid{display:grid;grid-template-columns:1fr 1fr .8fr .8fr auto;gap:6px;margin-top:6px;align-items:end}
.lgrid label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.lgrid .in,.lcard .in{padding:9px 10px}
.del{border:0;background:var(--red-soft);color:var(--red);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
.tot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:17px;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:8px;color:var(--acc)}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.hint.red{color:var(--red)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.logo-box{width:120px;height:80px;border:1px dashed var(--line);border-radius:12px;background:#fff center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px}
/* Aperçu facture */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px 20px;font-size:12px;color:#222;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.paper .ph{display:flex;gap:14px;align-items:flex-start;padding-bottom:10px;border-bottom:3px solid var(--pc)}
.paper .ph img{max-width:110px;max-height:70px;object-fit:contain}
.paper .ph .n{font-size:17px;font-weight:800;color:var(--pc)}
.paper .ph .e{white-space:pre-line;color:#555;font-size:11px;margin-top:3px;line-height:1.45}
.paper .meta{display:flex;justify-content:space-between;gap:14px;margin:16px 0;flex-wrap:wrap}
.paper .ttl{font-size:22px;font-weight:800;color:var(--pc);letter-spacing:.04em}
.paper .cli{border:1px solid #ddd;border-radius:6px;padding:9px 12px;min-width:200px;line-height:1.5}
.paper table{width:100%;border-collapse:collapse;font-size:11px}
.paper th{background:var(--pc);color:#fff;text-align:left;padding:6px 5px;font-weight:700}
.paper td{padding:6px 5px;border-bottom:1px solid #eee}
.paper .num{text-align:right;white-space:nowrap}
.paper .ptot{margin-left:auto;width:240px;margin-top:12px}
.paper .ptot div{display:flex;justify-content:space-between;padding:3px 6px}
.paper .ptot .b{background:var(--pc);color:#fff;font-weight:800;border-radius:4px;padding:6px}
.paper .words{margin-top:14px;font-size:11.5px}
.paper .pf{margin-top:26px;padding-top:8px;border-top:1.5px solid var(--pc);text-align:center;white-space:pre-line;font-size:10px;color:#666;line-height:1.5}
.tablewrap{overflow-x:auto}
.mv-in{color:var(--green)}.mv-out{color:var(--red)}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}.kpi .d.up{color:var(--green)}.kpi .d.down{color:var(--red)}.kpi .d span{font-weight:500;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}@media(min-width:760px){.dgrid{grid-template-columns:1fr 1fr}.dwide{grid-column:1/-1}}
.ct{font-weight:800;font-size:14px;margin-bottom:10px}.ct span{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.mchart{width:100%;height:auto;display:block}.mchart .gl{stroke:#ece9e1;stroke-width:1}.mchart .bl{stroke:#c9c4b8;stroke-width:1}.mchart .ax{font-size:10.5px;fill:var(--muted);font-family:inherit}.mchart .bar{fill:#7fb3ae}.mchart .bar.cur{fill:var(--acc)}.mchart .hit:hover .bar{fill:var(--acc)}
.hb{display:flex;flex-direction:column;gap:9px}.hbr{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;cursor:default}.hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ht{height:12px;background:#f1eee7;border-radius:4px;overflow:hidden}.hf{height:100%;background:var(--acc);border-radius:0 4px 4px 0}.hv{font-variant-numeric:tabular-nums;font-weight:700;min-width:44px;text-align:right}.hbr:hover .hf{background:#0b4744}
.empty.sm{padding:18px 12px;font-size:13px}
.tip{position:fixed;z-index:70;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;pointer-events:none;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none}
.dt{margin-top:8px;font-size:12.5px}.dt summary{cursor:pointer;color:var(--acc);font-weight:700}.dt table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}.dt th,.dt td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}.dt th:first-child,.dt td:first-child{text-align:left}
#print{display:none}
@media print{@page{size:A4;margin:12mm}#print .pw{width:100%;border-collapse:collapse}#print .pw>tbody>tr>td,#print .pw>tfoot>tr>td{padding:0;border:0;background:none}body{background:#fff}body>*:not(#print){display:none!important}#print{display:block}#print .paper{border:0;box-shadow:none;padding:0;font-size:11.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}#print .pf{position:fixed;bottom:0;left:0;right:0;margin:0;background:#fff}#print .paper tr{break-inside:avoid}#print .ptot,#print .words{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
  <div class="logo" id="top-logo">G</div>
  <h1 id="top-name">Ma gestion<small>Stock &amp; facturation</small></h1>
  <button class="iconbtn" id="gear" onclick="go('reglages')" aria-label="Paramètres">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>
<div id="banner"></div>
<main id="main"></main>
<nav class="nav" id="nav">
  <button data-v="accueil" onclick="go('accueil')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-v="produits" onclick="go('produits')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>Produits</button>
  <button data-v="stock" onclick="go('stock')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Stock</button>
  <button data-v="factures" onclick="go('factures')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8"/></svg>Factures</button>
  <button data-v="clients" onclick="go('clients')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Clients</button>
</nav>
<div id="modal"></div>
<div id="confirm"></div>

<script>
/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function fmt(n,d=2){n=Number(n)||0;const neg=n<0;const s=Math.abs(n).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'-':'')+s[0]+(d?','+s[1]:'')}
const fq=n=>fmt(n,Number.isInteger(+n)?0:2);
const money=n=>fmt(n)+' '+cfg().devise;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s?s.split('-').reverse().join('/'):'';
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
let toastT;function toast(m){clearTimeout(toastT);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;toastT=setTimeout(()=>t.remove(),2800)}

/* ---------- Données ---------- */
const COLS=['produits','clients','factures','mouvements'];
const S={produits:{},clients:{},factures:{},mouvements:{}};
let CFG={},LOGO='',DB=null,DL=null,MODE='init',LOADING=true,NET_NOTE='';
const DEF={nom:'',activite:'',adresse:'',ville:'',tel:'',email:'',site:'',ice:'',rc:'',if_:'',patente:'',cnss:'',banque:'',rib:'',entete:'',pied:'',couleur:'#0f5e5a',prefFact:'FAC',prefDevis:'DEV',prefBL:'BL',devise:'DH',monnaie:'dirham',tvaDef:20,conditions:''};
const cfg=()=>({...DEF,...CFG});
const LS='gestion_stock_facturation_v1';
const DESKTOP=location.protocol==='http:'&&location.hostname==='127.0.0.1';
const ANDROID=!!window.AndroidStore;
const UNBOXED=DESKTOP||ANDROID||location.protocol==='file:'||!(window.claude&&typeof window.claude.use==='function');
let andT=null;
function saveAndroid(){clearTimeout(andT);andT=setTimeout(flushAndroid,250)}
function flushAndroid(){clearTimeout(andT);andT=null;let ok=false;try{ok=AndroidStore.save(JSON.stringify({...S,config:CFG,logo:LOGO}))}catch(e){}if(!ok)toast('Erreur d’enregistrement sur le téléphone')}
window.__back=()=>{if($('#confirm').innerHTML){$('#confirm').innerHTML='';return true}if($('#modal').innerHTML){closeModal();return true}if(view!=='accueil'){go('accueil');return true}if(andT)flushAndroid();return false};
let dskT=null,dskBusy=false,dskAgain=false;
function applyData(d){d=d||{};COLS.forEach(k=>S[k]=d[k]||{});CFG=d.config||{};LOGO=d.logo||''}
async function loadDesktop(){const r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw new Error('load');applyData(await r.json())}
function saveDesktop(){clearTimeout(dskT);dskT=setTimeout(flushDesktop,250)}
async function flushDesktop(){if(dskBusy){dskAgain=true;return}dskBusy=true;try{const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...S,config:CFG,logo:LOGO})});if(!r.ok)throw 0;if(NET_NOTE){NET_NOTE='';render()}}catch(e){NET_NOTE='Enregistrement impossible : le programme semble fermé. Relancez GestionStock.exe (vos dernières modifications ne sont pas enregistrées).';render()}dskBusy=false;if(dskAgain){dskAgain=false;flushDesktop()}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');COLS.forEach(k=>S[k]=d[k]||{});CFG=d.config||{};LOGO=d.logo||''}catch(e){}}
function saveLocal(){if(ANDROID)return saveAndroid();if(DESKTOP)return saveDesktop();try{localStorage.setItem(LS,JSON.stringify({...S,config:CFG,logo:LOGO}))}catch(e){toast('Stockage local indisponible')}}
const wq={};
function persist(path,fn){const p=(wq[path]||Promise.resolve()).then(fn).catch(e=>{const c=e&&e.code;toast(c==='invalid_argument'?'Enregistrement refusé (accès en lecture seule ?)':c==='quota_exceeded'?'Capacité de stockage atteinte':'Erreur d’enregistrement, réessayez');console.error(e)});wq[path]=p;return p}
function put(col,id,obj){S[col][id]=obj;if(DB)persist(col+'/'+id,()=>DB.collection(col).doc(id).set(obj));else saveLocal()}
function del(col,id){delete S[col][id];if(DB)persist(col+'/'+id,()=>DB.collection(col).doc(id).delete());else saveLocal()}
function putCfg(o){CFG=o;if(DB)persist('settings/config',()=>DB.doc('settings/config').set(o));else saveLocal()}
function putLogo(d){LOGO=d;if(DB)persist('settings/logo',()=>d?DB.doc('settings/logo').set({data:d}):DB.doc('settings/logo').delete());else saveLocal()}

async function init(){
  render();
  if(ANDROID){MODE='android';try{applyData(JSON.parse(AndroidStore.load()||'{}'))}catch(e){NET_NOTE='Impossible de lire les données enregistrées.'}LOADING=false;render();
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&andT)flushAndroid()});addEventListener('pagehide',()=>{if(andT)flushAndroid()});return}
  if(DESKTOP){MODE='desktop';try{await loadDesktop()}catch(e){NET_NOTE='Impossible de lire les données. Relancez GestionStock.exe.'}LOADING=false;render();
    setInterval(()=>fetch('/api/ping',{cache:'no-store'}).catch(()=>{}),20000);fetch('/api/ping').catch(()=>{});
    addEventListener('pagehide',()=>{try{navigator.sendBeacon('/api/bye','1')}catch(e){}});return}
  let db=null;
  try{if(window.claude&&typeof claude.use==='function'){const r=await Promise.all([claude.use('db'),claude.use('downloads')]);db=r[0];DL=r[1]}}catch(e){}
  if(!db){MODE='local';LOADING=false;loadLocal();render();return}
  DB=db;MODE='db';
  const pending=new Set([...COLS,'settings']);
  const timer=setTimeout(()=>{NET_NOTE='Données inaccessibles pour l’instant — vérifiez votre connexion.';LOADING=false;render()},10000);
  const ok=(k,meta)=>{if(!meta.fromCache){pending.delete(k);if(!pending.size){clearTimeout(timer);NET_NOTE=''}}LOADING=false;render()};
  const fail=e=>{clearTimeout(timer);LOADING=false;NET_NOTE='Connexion aux données interrompue. Rechargez la page.';render()};

    </div>

function fItem(f){const st=statut(f);return`<div class="item" onclick="showFacture('${f.id}')"><div class="main"><div class="t">${esc(f.client&&f.client.nom||'—')}</div><div class="s">${esc(f.num)} · ${fd(f.date)}</div></div><div class="r">${money(calc(f).ttc)}<div class="s"><span class="badge ${st.c}">${st.t}</span></div></div></div>`}

/* ---------- Modales ---------- */
function openModal(title,html,foot){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet"><header><h4>${title}</h4><button class="x" onclick="closeModal()" aria-label="Fermer">×</button></header><div class="body">${html}</div></div></div>`;document.body.style.overflow='hidden'}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow=''}
function ask(msg,yes='Confirmer'){return new Promise(res=>{$('#confirm').innerHTML=`<div class="ov" style="z-index:50;align-items:center"><div class="sheet" style="max-width:380px;border-radius:18px;margin:16px"><div class="body"><div style="font-size:15px;margin-bottom:16px">${msg}</div><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cNo">Annuler</button><button class="btn danger" id="cYes">${yes}</button></div></div></div></div>`;$('#cNo').onclick=()=>{$('#confirm').innerHTML='';res(false)};$('#cYes').onclick=()=>{$('#confirm').innerHTML='';res(true)}})}
const field=(id,label,v,type='text',extra='')=>`<label class="f" for="${id}">${label}</label><input class="in" id="${id}" type="${type}" value="${esc(v??'')}" ${type==='number'?'step="any" inputmode="decimal"':''} ${extra}>`;
const tvaSel=(id,v)=>`<select class="in" id="${id}">${[20,14,10,7,0].map(t=>`<option value="${t}" ${num(v)===t?'selected':''}>${t} %</option>`).join('')}</select>`;

  ${field('p_nom','Désignation *',p.nom)}
  <div class="g2">${field('p_ref','Référence',p.ref)}${field('p_cat','Catégorie',p.cat,'text','list="cats"')}</div>
  <datalist id="cats">${[...new Set(Object.values(S.produits).map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="g3">${field('p_pa','Prix achat HT',p.pa,'number')}${field('p_pv','Prix vente HT *',p.pv,'number')}<div><label class="f">TVA</label>${tvaSel('p_tva',p.tva)}</div></div>
  <div class="g3">${id?`<div><label class="f">Stock actuel</label><div class="in" style="background:#f6f4ef">${fq(p.stock)}</div></div>`:field('p_stock','Stock initial',p.stock,'number')}${field('p_seuil','Seuil d’alerte',p.seuil,'number')}${field('p_unite','Unité',p.unite)}</div>
  ${id?`<div class="hint">Pour modifier le stock, utilisez un mouvement (entrée, sortie ou inventaire).</div>`:''}
  <div class="row" style="margin-top:18px"><button class="btn" style="flex:1" onclick="saveProduit(${id?`'${id}'`:'null'})">Enregistrer</button>${id?`<button class="btn sec" onclick="closeModal();mouvementForm('${id}')">± Stock</button><button class="btn danger" onclick="delProduit('${id}')">Supprimer</button>`:''}</div>`);
  setTimeout(()=>{if(!id)$('#p_nom').focus()},50);
}
function saveProduit(id){
  const nom=val('p_nom').trim();if(!nom)return toast('La désignation est requise');
  const old=id?S.produits[id]:{};
  const p={...old,nom,ref:val('p_ref').trim(),cat:val('p_cat').trim(),pa:num(val('p_pa')),pv:num(val('p_pv')),tva:num(val('p_tva')),seuil:num(val('p_seuil')),unite:val('p_unite').trim()};
  const nid=id||uid();
  if(!id){p.stock=num(val('p_stock'));p.cree=Date.now();if(p.stock)put('mouvements',uid(),{date:today(),ts:Date.now(),pid:nid,nom,type:'entree',qte:p.stock,motif:'Stock initial'})}
  put('produits',nid,p);closeModal();render();toast('Produit enregistré');
}
async function delProduit(id){if(!await ask('Supprimer ce produit ? L’historique des factures est conservé.','Supprimer'))return;del('produits',id);closeModal();render();toast('Produit supprimé')}

function mouvementForm(pid){
  const prods=arr(S.produits).sort((a,b)=>String(a.nom).localeCompare(b.nom,'fr'));
  if(!prods.length)return toast('Ajoutez d’abord un produit');
  openModal('Mouvement de stock',`
  <label class="f">Produit</label><select class="in" id="m_p" onchange="mvHint()">${prods.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.nom)} (stock : ${fq(p.stock)})</option>`).join('')}</select>
  <label class="f">Type</label><select class="in" id="m_t" onchange="mvHint()"><option value="entree">Entrée (achat, retour…)</option><option value="sortie">Sortie (perte, usage…)</option><option value="inventaire">Inventaire (fixer le stock réel)</option></select>
  <div class="g2">${field('m_q','Quantité','','number','oninput="mvHint()"')}${field('m_d','Date',today(),'date')}</div>
  ${field('m_m','Motif / fournisseur','')}
  <div class="hint" id="m_h"></div>
  <button class="btn block" style="margin-top:16px" onclick="saveMouvement()">Valider</button>`);mvHint();
}
function mvHint(){const p=S.produits[val('m_p')];if(!p)return;const q=num(val('m_q')),t=val('m_t');const n=t==='entree'?num(p.stock)+q:t==='sortie'?num(p.stock)-q:q;$('#m_h').innerHTML=`Stock actuel : <b>${fq(p.stock)}</b> → après : <b>${fq(n)}</b> ${esc(p.unite||'')}`}
function saveMouvement(){
  const pid=val('m_p'),p=S.produits[pid],t=val('m_t'),q=num(val('m_q'));
  if(!p)return;if(t!=='inventaire'&&q<=0)return toast('Quantité invalide');if(t==='inventaire'&&val('m_q')==='')return toast('Indiquez le stock réel');
  let d=t==='entree'?q:t==='sortie'?-q:r2(q-num(p.stock));
  if(!d){closeModal();return toast('Aucun changement')}
  put('produits',pid,{...p,stock:r2(num(p.stock)+d)});
  put('mouvements',uid(),{date:val('m_d')||today(),ts:Date.now(),pid,nom:p.nom,type:d>0?'entree':'sortie',qte:Math.abs(d),motif:val('m_m').trim()||(t==='inventaire'?'Inventaire':t==='entree'?'Entrée':'Sortie')});
  closeModal();render();toast('Stock mis à jour');
}

function saveClient(id){const nom=val('c_nom').trim();if(!nom)return toast('Le nom est requis');const nid=id||uid();put('clients',nid,{...(id?S.clients[id]:{cree:Date.now()}),nom,ice:val('c_ice').trim(),tel:val('c_tel').trim(),adresse:val('c_adr').trim(),ville:val('c_ville').trim(),email:val('c_email').trim()});closeModal();render();toast('Client enregistré')}

let D=null;
function factureForm(id,type,clientId){
  const f=id?JSON.parse(JSON.stringify(S.factures[id])):{type:type||'facture',date:today(),echeance:'',clientId:clientId||'',lignes:[],paye:0,mode:'',note:''};
  if(!id&&!f.lignes.length)f.lignes.push({pid:'',ref:'',des:'',qte:1,pu:0,tva:cfg().tvaDef,remise:0});

  const isD=f.type==='devis',isB=f.type==='bl';
  openModal((id?'Modifier ':(f.type==='facture'?'Nouvelle ':'Nouveau '))+TN[f.type].toLowerCase()+(id?' '+esc(f.num):''),`
  <label class="f">Client *</label>
  <select class="in" id="f_client" onchange="$('#newcli').style.display=this.value==='__new'?'block':'none'"><option value="">— Choisir —</option>${cls.map(c=>`<option value="${c.id}" ${c.id===f.clientId?'selected':''}>${esc(c.nom)}</option>`).join('')}<option value="__new" ${!cls.length?'selected':''}>+ Nouveau client…</option></select>

  <div class="g2">${field('f_date','Date',f.date,'date')}${isB?field('f_cmd','N° commande client',f.commande):field('f_ech',isD?'Valable jusqu’au':'Échéance',f.echeance,'date')}</div>
  ${isB?`${field('f_livr','Lieu de livraison (si différent)',f.livraison,'text','placeholder="Chantier, dépôt…"')}<label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600"><input type="checkbox" id="f_prix" ${f.prix?'checked':''} style="width:20px;height:20px"> Afficher les prix sur le bon de livraison</label>`:''}
  ${isD||isB?'':`<label class="f">Mode de paiement</label><select class="in" id="f_mode">${['','Espèces','Chèque','Virement','Effet','Carte bancaire'].map(m=>`<option ${m===f.mode?'selected':''} value="${m}">${m||'—'}</option>`).join('')}</select>`}
  <h3>Lignes</h3><div id="lines"></div>
  <button class="btn sec block" onclick="addLine()">+ Ajouter une ligne</button>
  <div class="tot" id="tot"></div>
  <label class="f">Note / conditions</label><textarea class="in" id="f_note" placeholder="${esc(cfg().conditions||'Ex. : Paiement à 30 jours')}">${esc(f.note||'')}</textarea>
  <button class="btn block" style="margin-top:16px" onclick="saveFacture()">Enregistrer ${leDoc(f)}</button>
  <div class="hint" style="text-align:center">${moves(f)?'Le stock des produits est mis à jour automatiquement.':f.viaBL?'Stock déjà déduit par le bon de livraison '+esc(f.origine||''):f.viaFact?'Stock déjà déduit par la facture '+esc(f.origine||''):''}</div>`);
  renderLines();
}
function renderLines(){
  if(!D||!$('#lines'))return;
  const prods=arr(S.produits).sort((a,b)=>String(a.nom).localeCompare(b.nom,'fr'));
  $('#lines').innerHTML=D.f.lignes.map((l,i)=>{const p=S.produits[l.pid];const lack=p&&moves(D.f)&&num(l.qte)>num(p.stock)+((D.id&&moves(S.factures[D.id]))?(S.factures[D.id].lignes||[]).filter(x=>x.pid===l.pid).reduce((s,x)=>s+num(x.qte),0):0);
  return `<div class="lcard">
   <select class="in" onchange="pickProd(${i},this.value)"><option value="">Article libre (sans stock)</option>${prods.map(p=>`<option value="${p.id}" ${p.id===l.pid?'selected':''}>${esc(p.nom)} — ${fq(p.stock)} en stock</option>`).join('')}</select>
   <input class="in" style="margin-top:6px" placeholder="Désignation" value="${esc(l.des)}" oninput="setL(${i},'des',this.value)">
   <div class="lgrid"><div><label>Qté</label><input class="in" type="number" step="any" inputmode="decimal" value="${l.qte}" oninput="setL(${i},'qte',this.value)"></div><div><label>P.U. HT</label><input class="in" type="number" step="any" inputmode="decimal" value="${l.pu}" oninput="setL(${i},'pu',this.value)"></div><div><label>TVA %</label><input class="in" type="number" step="any" inputmode="decimal" value="${l.tva}" oninput="setL(${i},'tva',this.value)"></div><div><label>Rem. %</label><input class="in" type="number" step="any" inputmode="decimal" value="${l.remise||0}" oninput="setL(${i},'remise',this.value)"></div><button class="del" onclick="rmLine(${i})" aria-label="Supprimer la ligne">✕</button></div>
   <div class="hint ${lack?'red':''}" id="lh${i}">${lack?'Attention : quantité supérieure au stock disponible ('+fq(p.stock)+')':'Total ligne HT : '+money(num(l.qte)*num(l.pu)*(1-num(l.remise)/100))}</div></div>`}).join('')||'<div class="empty" style="margin-bottom:8px">Aucune ligne.</div>';
  updTot();

  return doc;
}
function printFacture(id){const f=S.factures[id];if(!f)return;let el=$('#print');if(!el){el=document.createElement('div');el.id='print';document.body.appendChild(el)}el.innerHTML=`<table class="pw"><tbody><tr><td>${paperHTML(f)}</td></tr></tbody><tfoot><tr><td><div style="height:26mm"></div></td></tr></tfoot></table>`;const t=document.title;document.title=f.num+' - '+(f.client&&f.client.nom||'');setTimeout(()=>{if(ANDROID){try{AndroidStore.print(document.title)}catch(e){toast('Impression indisponible')}}else window.print();document.title=t},120)}
async function pdfFacture(id){
  const f=S.factures[id];if(!window.jspdf){if(UNBOXED){toast('Module PDF hors ligne : utilisez « Enregistrer en PDF » dans la fenêtre d’impression');return printFacture(id)}return toast('Le module PDF n’a pas pu se charger')}
  let blob;try{blob=buildPDF(f).output('blob')}catch(e){console.error(e);return toast('Erreur lors de la création du PDF')}
  saveFile(f.num+' - '+(f.client&&f.client.nom||'client').replace(/[\\/:*?"<>|]/g,'')+'.pdf',blob);
}
async function saveFile(name,data){
  if(ANDROID){try{const b=data instanceof Blob?data:new Blob([data]);const b64=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=ko;r.readAsDataURL(b)});toast(AndroidStore.saveFile(name,b64)||'Fichier enregistré')}catch(e){toast('Enregistrement du fichier impossible')}return}
  if(!DL&&UNBOXED){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Fichier enregistré dans Téléchargements')}catch(e){toast('Téléchargement impossible')}return}
  if(!DL){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));$('#confirm').innerHTML=`<div class="ov" style="z-index:50;align-items:center" onclick="if(event.target===this)this.remove()"><div class="sheet" style="max-width:380px;border-radius:18px;margin:16px"><div class="body"><p>Le téléchargement direct n’est pas disponible ici.</p><a class="btn block" href="${u}" target="_blank" rel="noopener">Ouvrir ${esc(name)}</a><button class="btn sec block" style="margin-top:8px" onclick="$('#confirm').innerHTML=''">Fermer</button></div></div></div>`}catch(e){toast('Téléchargement indisponible')}return}
  try{await DL.save({filename:name,data});toast('Fichier enregistré')}catch(e){const c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'Patientez un instant puis réessayez':'Téléchargement indisponible')}
}

/* ---------- Paramètres ---------- */
function entrepriseForm(){const c=cfg();openModal('Mon entreprise',`
  ${field('s_nom','Nom / Raison sociale',c.nom)}${field('s_act','Activité',c.activite,'text','placeholder="Ex. : Commerce de matériaux"')}
  ${field('s_adr','Adresse',c.adresse)}<div class="g2">${field('s_ville','Ville',c.ville)}${field('s_tel','Téléphone',c.tel,'tel')}</div>
  <div class="g2">${field('s_email','Email',c.email,'email')}${field('s_site','Site web',c.site)}</div>
  <h3>Identifiants légaux</h3><div class="g2">${field('s_ice','ICE',c.ice)}${field('s_rc','RC',c.rc)}${field('s_if','IF',c.if_)}${field('s_pat','Patente',c.patente)}${field('s_cnss','CNSS',c.cnss)}${field('s_banque','Banque',c.banque)}</div>${field('s_rib','RIB',c.rib)}
  <h3>Facturation</h3><div class="g2">${field('s_pf','Préfixe factures',c.prefFact)}${field('s_pd','Préfixe devis',c.prefDevis)}${field('s_pbl','Préfixe bons de livraison',c.prefBL)}${field('s_dev','Devise (symbole)',c.devise)}${field('s_mon','Monnaie en lettres',c.monnaie)}</div>
  <label class="f">TVA par défaut</label>${tvaSel('s_tva',c.tvaDef)}
  <label class="f">Conditions par défaut (bas de facture)</label><textarea class="in" id="s_cond">${esc(c.conditions)}</textarea>
  <button class="btn block" style="margin-top:16px" onclick="saveEntreprise()">Enregistrer</button>`)}
function saveEntreprise(){putCfg({...CFG,nom:val('s_nom').trim(),activite:val('s_act').trim(),adresse:val('s_adr').trim(),ville:val('s_ville').trim(),tel:val('s_tel').trim(),email:val('s_email').trim(),site:val('s_site').trim(),ice:val('s_ice').trim(),rc:val('s_rc').trim(),if_:val('s_if').trim(),patente:val('s_pat').trim(),cnss:val('s_cnss').trim(),banque:val('s_banque').trim(),rib:val('s_rib').trim(),prefFact:val('s_pf').trim()||'FAC',prefDevis:val('s_pd').trim()||'DEV',prefBL:val('s_pbl').trim()||'BL',devise:val('s_dev').trim()||'DH',monnaie:val('s_mon').trim()||'dirham',tvaDef:num(val('s_tva')),conditions:val('s_cond').trim()});closeModal();render();toast('Informations enregistrées')}
function enteteForm(){const c=cfg();openModal('En-tête & pied de page',`
  <div class="hint">Laissez vide pour générer automatiquement à partir des informations de l’entreprise.</div>
  <label class="f">En-tête (à côté du logo)</label><textarea class="in" id="s_ent" rows="4" placeholder="${esc(enteteDefault(c))}">${esc(c.entete)}</textarea>
  <label class="f">Pied de page (chaque page)</label><textarea class="in" id="s_pied" rows="4" placeholder="${esc(piedDefault(c))}">${esc(c.pied)}</textarea>
  <label class="f">Couleur principale</label><div class="row" style="align-items:center"><input type="color" id="s_col" value="${esc(c.couleur)}" style="width:56px;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff">${['#0f5e5a','#1d4ed8','#b42318','#7c3aed','#111827','#b45309'].map(x=>`<button class="chip" style="background:${x};width:30px;height:30px;padding:0;border:0" onclick="$('#s_col').value='${x}'" aria-label="${x}"></button>`).join('')}</div>
  <button class="btn block" style="margin-top:16px" onclick="putCfg({...CFG,entete:val('s_ent').trim(),pied:val('s_pied').trim(),couleur:val('s_col')});closeModal();render();toast('Modèle enregistré')">Enregistrer</button>`)}
function apercuModele(){const f={type:'facture',num:nextNum('facture'),date:today(),client:{nom:'Client exemple SARL',adresse:'12 rue Exemple, Casablanca',ice:'000000000000000'},lignes:[{ref:'ART-01',des:'Article de démonstration',qte:2,pu:150,tva:20,remise:0},{ref:'',des:'Prestation de service',qte:1,pu:500,tva:20,remise:10}],paye:0,id:'demo'};
  openModal('Aperçu du modèle',`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="saveFile('apercu-modele.pdf',buildPDF(window._demo).output('blob'))">⬇ PDF d’essai</button></div>${paperHTML(f)}`);window._demo=f}
function uploadLogo(inp){const file=inp.files[0];inp.value='';if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=600;let w=img.naturalWidth||img.width||300,h=img.naturalHeight||img.height||200;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.drawImage(img,0,0,w,h);let d=cv.toDataURL('image/png');if(d.length>220000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);d=cv.toDataURL('image/jpeg',.85)}putLogo(d);render();toast('Logo enregistré')};img.onerror=()=>toast('Image illisible');img.src=r.result};r.readAsDataURL(file)}

/* ---------- Export / sauvegarde ---------- */
const csvCell=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function exportCSV(){const rows=[['Référence','Désignation','Catégorie','Unité','Prix achat HT','Prix vente HT','TVA %','Stock','Seuil','Valeur stock']];arr(S.produits).forEach(p=>rows.push([p.ref,p.nom,p.cat,p.unite,fmt(p.pa),fmt(p.pv),p.tva,fq(p.stock),fq(p.seuil),fmt(num(p.stock)*num(p.pa))]));saveFile('produits-'+today()+'.csv','﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'))}
function exportFacturesCSV(){const rows=[['Type','Numéro','Date','Client','ICE client','Total HT','TVA','Total TTC','Payé','Reste','Statut']];arr(S.factures).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(f=>{const t=calc(f);rows.push([TN[f.type]||f.type,f.num,fd(f.date),f.client&&f.client.nom,f.client&&f.client.ice,fmt(t.ht),fmt(t.tva),fmt(t.ttc),fmt(f.paye),fmt(Math.max(0,t.ttc-num(f.paye))),statut(f).t])});saveFile('factures-'+today()+'.csv','﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'))}
function backup(){saveFile('sauvegarde-gestion-'+today()+'.json',JSON.stringify({version:1,date:new Date().toISOString(),...S,config:CFG,logo:LOGO}))}
function restore(inp){const file=inp.files[0];inp.value='';if(!file)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result)}catch(e){return toast('Fichier invalide')}if(!d||!COLS.some(k=>d[k]))return toast('Ce fichier n’est pas une sauvegarde valide');if(!await ask('Importer cette sauvegarde ? Les éléments du fichier remplaceront ceux portant le même identifiant.','Importer'))return;let n=0;COLS.forEach(k=>{Object.entries(d[k]||{}).forEach(([id,v])=>{if(v&&typeof v==='object'){put(k,id,v);n++}})});if(d.config&&typeof d.config==='object')putCfg(d.config);if(typeof d.logo==='string'&&d.logo.startsWith('data:image'))putLogo(d.logo);render();toast(n+' éléments importés')};r.readAsText(file)}

init();
</script>
