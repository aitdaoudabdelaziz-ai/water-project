<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الإدارة والأرشفة</title>
<style>
:root{--pri:#1f5f8b;--pri2:#164866;--bg:#f2f5f8;--card:#fff;--txt:#1d2733;--mut:#6b7785;--bd:#dde3ea;--in:#2e8b57;--out:#c0712b;--danger:#c0392b;--soft:#eaf2f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1f5f8b,#123a54)}
.lbox{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lbox h1{margin:0 0 4px;font-size:22px;color:var(--pri)}
.lbox p{margin:0 0 20px;color:var(--mut);font-size:13px}
/* layout */
#app{display:flex;min-height:100%}
aside{width:230px;background:var(--pri2);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
aside .brand{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;gap:10px;align-items:center}
aside .brand b{display:block;font-size:14px;line-height:1.4}
.slogo{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:#fff}
.llogo{width:110px;height:110px;border-radius:50%;display:block;margin:0 auto 12px}
.lbox{text-align:center}.lbox .f{text-align:right}
.lines{width:100%;border-collapse:collapse;margin-top:4px}
.lines td{padding:3px;border:0}
.lines input{padding:7px 8px}
.tot{font-weight:700;color:var(--pri);margin-top:4px;font-size:14px}
aside .brand small{opacity:.75;font-size:12px}
aside nav{flex:1;padding:8px}
aside nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:#dfe9f1;cursor:pointer;text-decoration:none;margin-bottom:2px}
aside nav a:hover{background:rgba(255,255,255,.08)}
aside nav a.on{background:#fff;color:var(--pri2);font-weight:600}
aside .me{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
aside .me a{color:#bcd6ea;cursor:pointer;display:inline-block;margin-top:6px;margin-left:10px}
main{flex:1;padding:22px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:20px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;border-right:5px solid var(--pri)}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--mut);font-size:13px}
.stat.in{border-right-color:var(--in)}.stat.out{border-right-color:var(--out)}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3e0;border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.f{margin-bottom:12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn.sec{background:#e7edf3;color:var(--txt)}
.btn.sec:hover{background:#d8e2ec}
.btn.red{background:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:11px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters>*{flex:1;min-width:140px}
.filters input.q{flex:3}
/* table */
.tw{overflow-x:auto;background:#fff;border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--bd);vertical-align:middle}
th{background:#f7f9fb;font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
td.nw{white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eef2f6;color:#45525f}
.tag.in{background:#e3f4ea;color:var(--in)}.tag.out{background:#fbeee2;color:var(--out)}
.tag.fin{background:#e4eefa;color:#1f5f8b}.tag.lit{background:#efe8fb;color:#6a43a8}.tag.pv{background:#fbf3d6;color:#85690a}.tag.ga{background:#fbe6ea;color:#a8324a}
.tag.ok{background:#e3f4ea;color:var(--in)}.tag.draft{background:#eef2f6;color:#6b7785}
aside .nsec{font-size:11px;opacity:.55;padding:12px 12px 4px}
.stat{cursor:pointer}.stat:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.stat.fin{border-right-color:#1f5f8b}.stat.lit{border-right-color:#6a43a8}.stat.pv{border-right-color:#c9a20f}.stat.ga{border-right-color:#a8324a}
.sub{font-weight:600;margin:4px 0 10px;color:var(--mut);font-size:14px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.muted{color:var(--mut);font-size:13px}
/* modal */
#ov{position:fixed;inset:0;background:rgba(15,25,35,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:50}
#md{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#md h3{margin:0 0 14px;font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:16px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--pri);background:var(--soft)}
.flist{list-style:none;padding:0;margin:8px 0 0}
.flist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;background:#f7f9fb;border-radius:8px;margin-bottom:5px;font-size:14px}
.flist li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.det b{color:var(--mut);font-weight:500}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}
.menu-btn{display:none}
#pov{position:fixed;inset:0;z-index:90;background:#fff;display:flex;flex-direction:column}
#pov .pov-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--pri2);color:#fff}
#pov .pov-hint{width:100%;font-size:12px;opacity:.85}
#pov iframe{flex:1;border:0;width:100%;background:#fff}
@media(max-width:800px){
 aside{position:fixed;top:0;bottom:0;right:0;z-index:40;transform:translateX(100%);transition:.2s}
 aside.open{transform:none}
 .menu-btn{display:inline-block}
 main{padding:14px}
 .grid{grid-template-columns:1fr}
 .det{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>

<div id="login">
 <form class="lbox" onsubmit="doLogin(event)">
  <img class="blogo llogo" alt="">
  <h1 id="lorg">جمعية الفتح للتنمية و التعاون</h1>
  <p>نظام الإدارة والأرشفة</p>
  <div class="f"><label>اسم المستخدم</label><input id="lu" autocomplete="username" required></div>
  <div class="f"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" required></div>
  <button class="btn wide">دخول</button>
  <div class="err" id="lerr"></div>
  <p class="muted" id="lfirst" style="margin-top:10px"></p>
 </form>
</div>

<div id="app" class="hidden">
 <aside id="side">
  <div class="brand"><img class="blogo slogo" alt=""><div><b id="sorg"></b><small>نظام الإدارة والأرشفة</small></div></div>
  <nav id="nav"></nav>
  <div class="me"><div id="meName"></div><a onclick="changeMyPass()">تغيير كلمة المرور</a><a onclick="logout()">خروج</a></div>
 </aside>
 <main id="main"></main>
</div>

<div id="ov" class="hidden" onmousedown="if(event.target===this)closeModal()"><div id="md"></div></div>
<div id="toast" class="hidden"></div>

<script>
/* ========== قاعدة البيانات المحلية (IndexedDB) ========== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('archiveSystemDB',1);
  r.onupgradeneeded=()=>{const d=r.result;
   d.createObjectStore('records',{keyPath:'id',autoIncrement:true});
   const f=d.createObjectStore('files',{keyPath:'id',autoIncrement:true});f.createIndex('recordId','recordId');
   d.createObjectStore('users',{keyPath:'username'});
   d.createObjectStore('settings',{keyPath:'key'});
   d.createObjectStore('log',{keyPath:'id',autoIncrement:true});};
  r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);});},
 st(s,m='readonly'){return this.db.transaction(s,m).objectStore(s)},
 p(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 all(s){return this.p(this.st(s).getAll())},
 get(s,k){return this.p(this.st(s).get(k))},
 put(s,v){return this.p(this.st(s,'readwrite').put(v))},
 del(s,k){return this.p(this.st(s,'readwrite').delete(k))},
 clear(s){return this.p(this.st(s,'readwrite').clear())},
 byIdx(s,i,v){return this.p(this.st(s).index(i).getAll(v))}
};

const fsize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';

 proj:['في طور الإعداد','قيد التنفيذ','منجز','متوقف']};

async function hash(s){
 try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('arch#'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;for(const c of 'arch#'+s)h=((h*33)^c.charCodeAt(0))>>>0;return 'x'+h;
}

/* ========== جسر المنصات: الحاسوب (EXE) والهاتف (APK) ========== */
const DESK=window.desk||null;
const CAP=(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())?window.Capacitor:null;
const capP=n=>CAP&&CAP.Plugins?CAP.Plugins[n]:null;
const safeName=n=>String(n||'file').replace(/[\\/:*?"<>|]+/g,'_').slice(0,120);
const VIEWABLE=/^(application\/pdf|image\/|text\/|video\/|audio\/)/;
async function capWrite(blob,name){const FS=capP('Filesystem');const d=await b2d(blob);
 const r=await FS.writeFile({path:'arch/'+Date.now()+'-'+safeName(name),data:d.split(',')[1],directory:'CACHE',recursive:true});return r.uri}
async function saveBlob(blob,name){
 if(DESK)return DESK.saveFile(safeName(name),await blob.arrayBuffer());
 if(CAP){const uri=await capWrite(blob,name);await capP('Share').share({title:name,files:[uri]});return true}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);return true}
async function openBlob(blob,name,type,download){
 if(DESK)return download?DESK.saveFile(safeName(name),await blob.arrayBuffer()):DESK.openFile(safeName(name),await blob.arrayBuffer());
 if(CAP){const uri=await capWrite(blob,name);const FO=capP('FileOpener');
  if(!download&&FO){try{await FO.open({filePath:uri,contentType:type||'application/octet-stream',openWithDefault:true});return}catch(e){}}
  await capP('Share').share({title:name,files:[uri]});return}
 if(VIEWABLE.test(type||'')&&!download){const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');if(!w)location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000)}
 else saveBlob(blob,name)}
function openPrint(html,title){
 if(CAP)return printOverlay(html,title);
 const w=window.open('','_blank');if(!w)return toast('اسمح بالنوافذ المنبثقة للطباعة');w.document.write(html);w.document.close()}
function printOverlay(html,title){
 const clean=html.replace(/<script>onload[\s\S]*?<\/script>/,'');
 if($('pov'))$('pov').remove();
 const ov=document.createElement('div');ov.id='pov';
 ov.innerHTML=`<div class="pov-bar"><b>${esc(title||'معاينة')}</b><span><button class="btn sm" id="pov-sh">📤 مشاركة / حفظ</button> <button class="btn sm sec" id="pov-x">إغلاق</button></span><div class="pov-hint">للطباعة أو الحفظ PDF: اضغط «مشاركة»، افتح الملف بمتصفح Chrome، ثم اختر «طباعة».</div></div><iframe id="pov-f" title="معاينة"></iframe>`;
 document.body.appendChild(ov);$('pov-f').srcdoc=clean;
 $('pov-x').onclick=()=>ov.remove();
 $('pov-sh').onclick=()=>saveBlob(new Blob([clean],{type:'text/html'}),safeName(title||'document')+'.html').catch(()=>toast('تعذرت المشاركة'));
}

async function init(){
 try{await DB.open()}catch(e){document.body.innerHTML='<p style="padding:30px">تعذر فتح قاعدة البيانات المحلية. استعمل متصفح Chrome أو Edge.</p>';return}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

 if(!SET.org||SET.org==='اسم المؤسسة'){SET.org='جمعية الفتح للتنمية و التعاون';await DB.put('settings',{key:'org',value:SET.org})}
 if(SET.place===undefined){SET.place='أكادير السرغين';await DB.put('settings',{key:'place',value:SET.place})}
 if(SET.founded===undefined){SET.founded='1999';await DB.put('settings',{key:'founded',value:SET.founded})}
 applyBrand();
 for(const [flag,P] of [['seed_maawa',PRESET_MAAWA],['seed_pool',PRESET_POOL]])if(!SET[flag]){

  await DB.put('records',p);SET[flag]=true;await DB.put('settings',{key:flag,value:true});
 }
 if(!SET.cats){SET.cats=['شؤون إدارية','شؤون مالية','الموارد البشرية','شؤون تربوية','شراكات','مذكرات ودوريات','أخرى'];await DB.put('settings',{key:'cats',value:SET.cats})}
 const users=await DB.all('users');
 if(!users.length){await DB.put('users',{username:'admin',name:'المدير',role:'admin',pass:await hash('admin'),mustChange:true})}
 if(!users.length||users.every(u=>u.mustChange))$('lfirst').textContent='أول دخول: المستخدم admin وكلمة المرور admin (سيُطلب تغييرها).';
 $('lorg').textContent=SET.org;
 const s=sessionStorage.getItem('archUser');
 if(s){const u=await DB.get('users',s);if(u){ME=u;return showApp()}}
 $('lu').focus();
}

function table(rs,showType,type){
 if(!rs.length)return '<div class="empty">لا توجد عناصر</div>';
 const third=!type||isMail(type)?'التصنيف':isRep(type)?'الحالة':type==='asset'?'الكمية · القيمة':type==='proj'?'الحالة · الإنجاز':'الحاضرون';
 const cell3=r=>isMail(r.type)?(r.category?`<span class="tag">${esc(r.category)}</span>`:''):isRep(r.type)?(r.status?`<span class="tag ${r.status==='مصادق عليه'?'ok':'draft'}">${esc(r.status)}</span>`:'')
  :r.type==='asset'?`<span class="nw">${esc(r.qty||1)} · ${money(assetVal(r))}</span>${r.cond&&r.cond!=='جيدة'?` <span class="tag ga">${esc(r.cond)}</span>`:''}`
  :r.type==='proj'?`<span class="tag ${PSTAT[r.mtype]||''}">${esc(r.mtype)}</span> <span class="muted">${esc(r.progress||0)}%</span>`:(r.attend?esc(r.attend):'');
 return `<div class="tw" style="border:0;border-radius:0 0 12px 12px"><table><thead><tr>${showType?'<th>النوع</th>':''}<th>${type==='asset'?'رقم الجرد':'الرقم'}</th><th>${type==='asset'?'تاريخ الاقتناء':type==='proj'?'البداية':'التاريخ'}</th><th>${colName(type)}</th><th>${type==='asset'?'التسمية':type==='proj'?'المشروع':type&&!isMail(type)?'العنوان':'الموضوع'}</th><th>${showType?'تفاصيل':third}</th><th>الوثائق</th></tr></thead><tbody>
 ${rs.map(r=>`<tr onclick="viewRec(${r.id})">${showType?`<td class="nw"><span class="tag ${r.type}">${TYPES[r.type]}</span></td>`:''}<td class="nw"><b>${esc(r.num)}</b></td><td class="nw">${fdate(r.date)}</td><td>${esc(partyOf(r))}</td><td>${esc(r.subject)}</td><td>${cell3(r)}</td>
 <td class="nw">${r.fileCount?`<button class="btn sm" onclick="event.stopPropagation();quickOpen(${r.id})">📄 فتح${r.fileCount>1?' ('+r.fileCount+')':''}</button>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

function matchQ(r,q){if(!q)return true;q=q.toLowerCase();return [r.num,r.party,r.subject,r.ref,r.notes,r.category,r.period,r.mtype,r.place,r.agenda,r.decisions,r.partner,r.holder,r.goals,r.source,r.cond,...(r.fileNames||[])].some(v=>String(v||'').toLowerCase().includes(q))}
const sortRecs=a=>a.sort((x,y)=>(y.date||'').localeCompare(x.date||'')||String(y.num).localeCompare(String(x.num),undefined,{numeric:true}));
function fList(){
 const q=$('fq').value.trim(),y=$('fy').value,c=$('fc')?$('fc').value:'',m=$('fm')?$('fm').value:'';
 LIST.shown=sortRecs(LIST.recs.filter(r=>matchQ(r,q)&&(!y||(r.date||'').startsWith(y))&&(!c||r.category===c)&&(!m||r.mtype===m)));
 const extra=LIST.type==='asset'?` · القيمة الإجمالية: ${money(LIST.shown.reduce((a,r)=>a+assetVal(r),0))}`:LIST.type==='proj'?` · مجموع الميزانيات: ${money(LIST.shown.reduce((a,r)=>a+(parseFloat(r.budget)||0),0))}`:'';
 $('tbl').innerHTML=`<div style="padding:10px 16px" class="muted">${LIST.shown.length} عنصر${extra}</div>`+table(LIST.shown,false,LIST.type);
}

async function nextNum(type,year){
 const n=(await DB.all('records')).filter(r=>r.type===type&&(r.date||'').startsWith(year)).map(r=>parseInt(String(r.num).split('/').pop())||0);
 return year+'/'+String((n.length?Math.max(...n):0)+1).padStart(4,'0');
}

function leRow(name,o={}){const cols=LECOLS[name];return `<tr>${cols.map(c=>{

  :`<input data-k="${c[0]}" ${c[2]==='number'?'type="number" step="0.01" min="0"':c[2]==='date'?'type="date"':''} placeholder="${c[1]}" value="${esc(o[c[0]])}" oninput="calcFin()">`;
 return `<td${w}>${inp}</td>`}).join('')}<td style="width:44px"><button type="button" class="btn sm sec" onclick="this.closest('tr').remove();calcFin()">✕</button></td></tr>`}
function lineEd(name,lines,cols){LECOLS[name]=cols;return `<table class="lines" id="le_${name}"><tbody>${(lines.length?lines:[{}]).map(o=>leRow(name,o)).join('')}</tbody></table><button type="button" class="btn sm sec" onclick="$('le_${name}').tBodies[0].insertAdjacentHTML('beforeend',leRow('${name}'))">+ إضافة سطر</button>`}
function leRead(name){const t=$('le_'+name);if(!t)return null;return [...t.tBodies[0].rows].filter(tr=>[...tr.querySelectorAll('input')].some(i=>i.value.trim())).map(tr=>{const o={};tr.querySelectorAll('input,select').forEach(i=>o[i.dataset.k]=i.value.trim());return o})}
const sumL=L=>(L||[]).reduce((s,x)=>s+(parseFloat(x.a)||0),0);
const balance=r=>(parseFloat(r.opening)||0)+(parseFloat(r.income)||0)-(parseFloat(r.expense)||0);
function calcFin(){
 if($('projtot')){const s=sumL(leRead('sp')),b=parseFloat($('r_budget').value)||0;$('projtot').textContent=`المصروف: ${money(s)} · المتبقي من الميزانية: ${money(b-s)}${b?' · نسبة الصرف: '+Math.round(s/b*100)+'%':''}`}
 if(!$('fintot'))return;const i=sumL(leRead('inc')),e=sumL(leRead('exp')),o=parseFloat($('r_opening').value)||0;$('fintot').textContent=`مجموع المداخيل: ${money(i)} · مجموع المصاريف: ${money(e)} · الرصيد النهائي: ${money(o+i-e)}`}
function addPending(fl){for(const f of fl)PENDING.push(f);renderPending()}
function renderPending(){$('plist').innerHTML=PENDING.map((f,i)=>`<li><span>🆕 ${esc(f.name)} <small class="muted">${fsize(f.size)}</small></span><button type="button" class="btn sm sec" onclick="PENDING.splice(${i},1);renderPending()">إزالة</button></li>`).join('')}
async function saveRec(e,id,type){
 e.preventDefault();
 const old=id?await DB.get('records',id):{};
 const v=k=>$(k)?$(k).value.trim():'';
 const r={...old,type,num:v('r_num'),date:v('r_date'),party:v('r_party'),subject:v('r_subject'),ref:v('r_ref'),category:v('r_cat'),notes:v('r_notes'),
  period:v('r_period'),status:v('r_status'),mtype:v('r_mtype'),place:v('r_place'),attend:v('r_attend'),agenda:v('r_agenda'),decisions:v('r_decisions')};
 if(type==='fin'){r.opening=v('r_opening');r.incLines=leRead('inc');r.expLines=leRead('exp');r.income=String(sumL(r.incLines));r.expense=String(sumL(r.expLines))}
 if(type==='lit'){r.intro=v('r_intro');r.actLines=leRead('act');r.diff=v('r_diff');r.prosp=v('r_prosp')}
 if(type==='asset'){r.qty=v('r_qty')||'1';r.value=v('r_value');r.source=v('r_source');r.cond=v('r_cond');r.holder=v('r_holder')}
 if(type==='proj'){Object.assign(r,{end:v('r_end'),partner:v('r_partner'),holder:v('r_holder'),budget:v('r_budget'),contrib:v('r_contrib'),benef:v('r_benef'),goals:v('r_goals'),taskLines:leRead('task'),spLines:leRead('sp')});
  r.spent=String(sumL(r.spLines));const tl=r.taskLines;r.progress=r.mtype==='منجز'?100:tl.length?Math.round(tl.filter(x=>x.s==='منجزة').length/tl.length*100):0}
 const dup=(await DB.all('records')).find(x=>x.type===type&&x.num===r.num&&x.id!==id);
 if(dup&&!confirm('الرقم '+r.num+' مستعمل من قبل في '+TYPES[type]+'. المتابعة رغم ذلك؟'))return;
 if(id){r.id=id;r.updatedAt=new Date().toISOString();r.updatedBy=ME.username}else{r.createdAt=new Date().toISOString();r.createdBy=ME.username}
 const rid=await DB.put('records',r);
 for(const f of PENDING)await DB.put('files',{recordId:rid,name:f.name,type:f.type,size:f.size,blob:f,addedAt:new Date().toISOString(),addedBy:ME.username});
 await syncFiles(rid);
 await log((id?'تعديل ':'إضافة ')+TYPES[type]+' رقم '+r.num);
 closeModal();toast('تم الحفظ');go(CUR==='dash'||CUR==='search'?CUR:type);
}
async function syncFiles(rid){const r=await DB.get('records',rid),fs=await DB.byIdx('files','recordId',rid);r.fileCount=fs.length;r.fileNames=fs.map(f=>f.name);await DB.put('records',r)}
async function delFile(fid,rid){
 if(!confirm('حذف هذه الوثيقة نهائيا؟'))return;
 const f=await DB.get('files',fid);await DB.del('files',fid);await syncFiles(rid);await log('حذف وثيقة '+f.name);
 const keep=PENDING;await openForm(rid);PENDING=keep;renderPending();
}

function detRows(r){
 const t=r.type,R=[['الرقم',r.num],['التاريخ',fdate(r.date)]];
 if(isMail(t))R.push([colName(t),r.party],['المرجع',r.ref],['التصنيف',r.category]);
 else if(isRep(t)){R.push(['الفترة المعنية',r.period],['حالة المصادقة',r.status]);
  if(t==='fin'&&(r.income||r.expense||r.opening))R.push(['الرصيد السابق',money(r.opening)],['مجموع المداخيل',money(r.income)],['مجموع المصاريف',money(r.expense)],['الرصيد النهائي',money(balance(r))]);
  if(t==='lit'&&r.actLines&&r.actLines.length)R.push(['الأنشطة المنجزة',r.actLines.length+' نشاط']);
  R.push(['المصادقة / المرجع',r.ref]);}
 else if(t==='asset'){R[0][0]='رقم الجرد';R[1][0]='تاريخ الاقتناء';
  R.push(['الصنف',r.mtype],['الكمية',r.qty||1],['القيمة الفردية',money(r.value)],['القيمة الإجمالية',money(assetVal(r))],['مصدر الاقتناء',r.source],['المكان',r.place],['الحالة',r.cond],['المسؤول عن العهدة',r.holder],['الفاتورة / المرجع',r.ref]);}
 else if(t==='proj'){R[1][0]='الفترة';R[1][1]=fdate(r.date)+(r.end?' ← '+fdate(r.end):'');
  R.push(['الحالة',r.mtype],['نسبة الإنجاز',(r.progress||0)+'%'],['الشريك / الممول',r.partner],['المسؤول',r.holder],['المكان',r.place],['المستفيدون',r.benef],
   ['الميزانية',money(r.budget)],['مساهمة الجمعية',money(r.contrib)],['المصروف',money(r.spent)],['المتبقي',money((parseFloat(r.budget)||0)-(parseFloat(r.spent)||0))]);
  if(r.goals)R.push(['الأهداف',r.goals]);
  if(r.taskLines&&r.taskLines.length)R.push(['المهام',r.taskLines.map(x=>(x.s==='منجزة'?'✅ ':x.s==='جارية'?'⏳ ':'▫️ ')+x.a+(x.d?' ('+fdate(x.d)+')':'')).join('\n')]);}
 else{R.push(['النوع',r.mtype],['المكان',r.place],['عدد الحاضرين',r.attend],['المرجع',r.ref]);
  if(r.agenda)R.push(['جدول الأعمال',r.agenda]);if(r.decisions)R.push(['القرارات',r.decisions]);}
 R.push(['ملاحظات',r.notes]);return R;
}

 $('bmsg').textContent='جارٍ تحضير النسخة...';
 const files=await DB.all('files'),out=[];
 for(const f of files){const {blob,...m}=f;out.push({...m,data:await b2d(blob)})}
 const data={app:'archive-system',version:1,exportedAt:new Date().toISOString(),records:await DB.all('records'),users:await DB.all('users'),settings:await DB.all('settings'),log:await DB.all('log'),files:out};
 let ok=true;try{ok=await saveBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'archive-backup-'+today()+'.json')}catch(e){ok=false}
 if(ok===false){$('bmsg').textContent='لم يتم حفظ النسخة.';return}
 await log('تصدير نسخة احتياطية');
 $('bmsg').textContent='تم تصدير '+data.records.length+' مراسلة و'+out.length+' وثيقة.';
}
async function importAll(file){
 if(!file)return;
 let data;try{data=JSON.parse(await file.text())}catch(e){return toast('ملف غير صالح')}
 if(data.app!=='archive-system')return toast('هذا الملف ليس نسخة احتياطية لهذا النظام');
 if(!confirm('سيتم استبدال كل البيانات الحالية بمحتوى النسخة ('+data.records.length+' مراسلة). متابعة؟'))return;
 $('bmsg').textContent='جارٍ الاسترجاع...';
 for(const s of ['records','files','users','settings','log'])await DB.clear(s);
 for(const r of data.records)await DB.put('records',r);
 for(const u of data.users)await DB.put('users',u);
 for(const s of data.settings)await DB.put('settings',s);
 for(const l of data.log||[])await DB.put('log',l);
 for(const f of data.files){const {data:d,...m}=f;await DB.put('files',{...m,blob:d2b(d)})}
 alert('تم الاسترجاع بنجاح. سيُعاد تحميل النظام.');sessionStorage.removeItem('archUser');location.reload();
}

init();
</script>
