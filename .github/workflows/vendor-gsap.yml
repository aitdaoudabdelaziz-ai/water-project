name: Fetch GSAP for the new app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-gsap.yml']
jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download gsap 3.13.0 (free standard license)
        run: |
          mkdir -p /tmp/g && cd /tmp/g && npm init -y >/dev/null && npm i --no-audit --no-fund gsap@3.13.0
          cd $GITHUB_WORKSPACE && mkdir -p react-src/vendor
          cp /tmp/g/node_modules/gsap/dist/gsap.min.js react-src/vendor/gsap.min.js
          cp /tmp/g/node_modules/gsap/LICENSE.md react-src/vendor/LICENSE-gsap.md 2>/dev/null || cp /tmp/g/node_modules/gsap/README.md react-src/vendor/README-gsap.md
          ls -la react-src/vendor
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-src/vendor && git commit -m "GSAP 3.13.0 (self-hosted)" && git pull --rebase && git push || echo "nothing to commit"
