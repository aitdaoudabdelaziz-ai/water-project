name: Build APK
on:
  push:
    branches: [ wydad-apk ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle Excel library offline
        run: |
          curl -fsSL -o app/src/main/assets/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' app/src/main/assets/index.html
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk WydadAsserghine.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WydadAsserghine-apk
          path: WydadAsserghine.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wydad-latest -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create wydad-latest WydadAsserghine.apk -R ${{ github.repository }} --target ${{ github.sha }} --title "وداد أسرغين APK" --notes "آخر نسخة من تطبيق وداد أسرغين" --prerelease
