name: archive-apk (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - 'archive/mobile/**'
      - '.github/workflows/archive-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: App icon and splash from the association logo
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Sync web app and plugins
        run: npx cap sync android
      - name: Build APK
        working-directory: archive/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AlFath-Archive-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlFath-Archive-Android
          path: archive/mobile/AlFath-Archive-1.0.0.apk
          if-no-files-found: error
