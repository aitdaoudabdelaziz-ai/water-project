name: React - build check
on:
  push:
    branches: [main]
    paths: ['react-src/**', '.github/workflows/react.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        working-directory: react-src
        run: npm install --no-audit --no-fund && node build.mjs
      - name: Built app is present
        run: test -s react/app.js && test -s react/index.html && test -s react/styles.css
