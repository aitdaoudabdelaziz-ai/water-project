name: Fetch SheetJS (Excel) for the new app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor.yml']
jobs:
  vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Download xlsx 0.18.5 (Apache-2.0)
        run: |
          mkdir -p /tmp/x && cd /tmp/x && npm init -y >/dev/null && npm i --no-audit --no-fund xlsx@0.18.5
          cd $GITHUB_WORKSPACE && mkdir -p react-src/vendor
          cp /tmp/x/node_modules/xlsx/dist/xlsx.full.min.js react-src/vendor/
          cp /tmp/x/node_modules/xlsx/LICENSE react-src/vendor/LICENSE-xlsx.txt
          ls -la react-src/vendor
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add react-src/vendor && git commit -m "SheetJS 0.18.5 for Excel import/export (self-hosted)" && git pull --rebase && git push || echo "nothing to commit"
